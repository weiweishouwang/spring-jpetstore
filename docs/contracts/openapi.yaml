openapi: 3.1.0
info:
  title: JPetStore REST API
  version: 1.0.0
  description: 学习演示商城。Q01～Q15已确认；只做模拟支付。价格CNY，账号购物车跨设备恢复且退出保留。此为契约，不代表实现已完成。
servers:
- url: /
  description: 同源站点，开发由Vite代理/api
tags:
- name: identity
  description: 会话认证及CSRF
- name: account
  description: 账户与偏好
- name: catalog
  description: 商品目录
- name: cart
  description: 游客及账号购物车
- name: order
  description: 确认与订单
security: []
paths:
  /api/auth/csrf:
    get:
      operationId: getCsrf
      tags:
      - identity
      summary: getCsrf
      description: 遵循已确认业务规则与统一错误契约。
      security: []
      parameters:
      - &id001
        name: API-Version
        in: header
        required: false
        schema:
          type: string
          enum:
          - '1.0'
          default: '1.0'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '405':
          $ref: '#/components/responses/Error405'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/accounts:
    post:
      operationId: registerAccount
      tags:
      - account
      summary: registerAccount
      description: 注册不自动登录。
      security: []
      parameters:
      - *id001
      - &id002
        name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: 从/api/auth/csrf取得；登录/退出后重新获取。
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          headers:
            Location:
              description: 新资源的站内路径
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '405':
          $ref: '#/components/responses/Error405'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAccountRequest'
  /api/auth/session:
    post:
      operationId: login
      tags:
      - identity
      summary: login
      description: 标准Security表单认证，session fixation保护。登录合并游客车到账号活动车；超限提示且保留双方内容，不因合并问题丢车。成功后重新获取CSRF。
      security: []
      parameters:
      - *id001
      - *id002
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '405':
          $ref: '#/components/responses/Error405'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 25
                password:
                  type: string
                  minLength: 1
                  maxLength: 64
                  writeOnly: true
              required:
              - username
              - password
    get:
      operationId: getSession
      tags:
      - identity
      summary: getSession
      description: 遵循已确认业务规则与统一错误契约。
      security: []
      parameters:
      - *id001
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '405':
          $ref: '#/components/responses/Error405'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/auth/logout:
    post:
      operationId: logout
      tags:
      - identity
      summary: logout
      description: 失效登录会话、清Cookie，保留账号购物车，不转交其他用户。
      security:
      - CookieAuth: []
      parameters:
      - *id001
      - *id002
      responses:
        '204':
          description: 成功，无响应体
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '405':
          $ref: '#/components/responses/Error405'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/account/me:
    get:
