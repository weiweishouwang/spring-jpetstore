      tags:
      - cart
      summary: retryCartMerge
      description: 登录时先自动合并；超限保留双方并展示pendingMerges。用户调整账号车后显式重试，按账号授权/锁定及expectedVersion整批合并；成功消费待合并来源，仍超限409且不丢数据。
      security:
      - CookieAuth: []
      parameters:
      - *id001
      - *id002
