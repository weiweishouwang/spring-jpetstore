name: Backup

# T446: 受控备份调度工作流。
#
# 只做备份，不做自动恢复：恢复必须由人工按运行手册在隔离目标上执行并演练。
# 备份使用独立的备份凭据与可达私有数据库的受信任 runner；并发锁保证同一目标不会同时备份。

on:
  schedule:
    # 每天 03:17（避开整点高峰）；备份窗口与 RPO 目标一致。
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: '备份目标（隔离目标标识）'
        required: true

permissions:
  contents: read

concurrency:
  group: backup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  backup:
    name: consistent backup with manifest
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Backup
        run: |
          python3 scripts/backup-restore.py \
            --target "${{ secrets.BACKUP_SOURCE_URL }}" \
            --output-dir "target/backup-${{ github.run_id }}"
      - name: Verify the backup
        run: |
          python3 - <<'PY'
          import json, pathlib
          manifest = json.loads(pathlib.Path("target").glob("backup-*/manifest.json").__next__().read_text())
          assert manifest["checksum"], "备份缺少校验值"
          assert manifest["size"] > 0, "备份文件为空"
          print("备份校验通过")
          PY
      - name: Upload the encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: target/backup-*
          retention-days: 30
          compression-level: 9
      - name: Notify on failure
        if: failure()
        run: |
          echo "备份失败：需要人工介入（恢复必须按运行手册在隔离目标执行）" >&2
          exit 1
