name: CI

# T419: PR 持续集成流水线。
#
# 门禁内容：后端 verify（含 Testcontainers 集成测试）、前端 lint/typecheck/test/build、OpenAPI
# 契约校验与真实浏览器 E2E。失败时上传报告；PR 阶段不发布镜像。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          retention-days: 14

  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  contract:
    name: openapi contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint the contract
        run: npm run openapi:lint
      - name: Check the generated types are up to date
        run: |
          npm run openapi:types
          if ! git diff --quiet -- src/shared/api/schema.d.ts; then
            echo "schema.d.ts 与契约不一致，请重新生成后提交。"
            git diff -- src/shared/api/schema.d.ts
            exit 1
          fi

  e2e:
    name: browser end to end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start MySQL
        run: |
          docker compose -f infra/compose.dev.yml up -d mysql
          docker compose -f infra/compose.dev.yml ps
      - name: Build the application
        run: ./mvnw -B -ntp -Prelease -DskipTests package
      - name: Run the browser tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test
      - name: Upload the browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
