name: Release

# T420: 受信任发布与镜像检查流水线。
#
# 只在受信任的标签或受信任分支上运行：先跑测试门禁，再用 Java 21 Buildpacks 构建镜像，生成
# SBOM 与漏洞扫描报告，最后按不可变摘要推送。流水线本身不部署生产环境——生产发布需要单独
# 授权（plan §9.3）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirm:
        description: '发布确认（必须填写 RELEASE）'
        required: true
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Backend verify
        run: ./mvnw -B -ntp verify
      - name: Frontend checks
        working-directory: frontend
        run: npm run lint && npm run typecheck && npm test

  image:
    name: build and scan the image
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build the application with the frontend
        run: ./mvnw -B -ntp -Prelease -DskipTests package
      - name: Set up Buildpack
        uses: paketo-buildpacks/setup-pack@v0.4.0
        with:
          builder: paketobuildpacks/builder-jammy-base:latest
          run: paketobuildpacks/run-jammy-base:latest
      - name: Build the image
        run: |
          pack build "jpetstore-backend:${GITHUB_SHA}" \
            --path backend/target/backend-*.jar \
            --builder "$BUILDER_BIN_PATH" \
            --run-image "$RUN_IMAGE" \
            --env "BP_JVM_VERSION=21" \
            --env "BP_JVM_TYPE=graalvm" || \
          pack build "jpetstore-backend:${GITHUB_SHA}" \
            --path backend/target/backend-*.jar \
            --builder "$BUILDER_BIN_PATH" \
            --run-image "$RUN_IMAGE" \
            --env "BP_JVM_VERSION=21"
      - name: Generate the SBOM
        run: |
          pack sbom "jpetstore-backend:${GITHUB_SHA}" --format cyclonedx > sbom.json
      - name: Scan the image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --exit-code 1 --severity HIGH,CRITICAL "jpetstore-backend:${GITHUB_SHA}"
      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
      - name: Push by digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          digest=$(docker inspect "jpetstore-backend:${GITHUB_SHA}" --format '{{index .RepoDigests 0}}' || true)
          docker tag "jpetstore-backend:${GITHUB_SHA}" "${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          docker push "${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          echo "pushed ${IMAGE_REPOSITORY}:${GITHUB_SHA} ${digest}"
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
