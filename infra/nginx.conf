# T431: 同源 HTTPS 与反向代理配置片段。
#
# 站点只有一个来源：Vue 静态资源与 /api 都由同一个站点提供，因此 Cookie 与 CSRF 语义与开发
# 环境一致（plan §3.1、§5.2）。
#
# 约束：
#   * 只有明确的 API 与静态资源路径会被转发；未知 API 保持错误响应，不回退成 SPA 页面；
#   * 前端路由路径回退到应用提供的 index.html，由前端路由接管；
#   * 管理端点只允许本机访问，不经公网暴露；
#   * 只信任来自本机代理的 forwarded headers。

upstream jpetstore_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name shop.example.com;
    # 证书与私钥以文件引用提供，值不写进仓库。
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 请求体上限：模拟支付与购物车请求都很小。
    client_max_body_size 1m;

    location /actuator/ {
        # 管理端点只允许本机访问。
        allow 127.0.0.1;
        deny all;
        proxy_pass http://jpetstore_backend;
    }

    location /api/ {
        proxy_pass http://jpetstore_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 只信任本机代理带来的转发信息。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        proxy_pass http://jpetstore_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # 前端路由：回退到应用提供的入口页。
        proxy_pass http://jpetstore_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }
}
